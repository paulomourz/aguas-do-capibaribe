name: Teste de carga

# Roda os testes de carga (k6) num ambiente descartável do Docker, no próprio GitHub Actions: o de lotes sem pausa
# (de 10 a 100 sensores) e o do turno industrial (120 sensores com picos, #165). Não toca no site publicado.
# Sob demanda (Actions > Teste de carga > Run workflow) e em todo PR que mude os testes. Ver docs/tecnico/teste-carga.md.
on:
  workflow_dispatch:
    inputs:
      pool:
        description: Conexões no pool do banco (HikariCP)
        default: '20'
  pull_request:
    branches: [develop]
    paths:
      - testes-carga/**
      - docker-compose.carga.yml
      - .github/workflows/carga.yml

permissions:
  contents: read

jobs:
  carga:
    name: carga (pool ${{ matrix.pool }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # No PR, compara pool 10 e 20 (padrão); sob demanda, usa o valor informado.
        pool: ${{ fromJSON(inputs.pool && format('["{0}"]', inputs.pool) || '["10", "20"]') }}
    env:
      DB_POOL_MAX: ${{ matrix.pool }}
      # 2 CPUs divididas entre k6, API e banco: meta de p95 maior que a do PC (200 ms).
      META_P95_MS: '500'
      COMPOSE: docker compose -p aguas-carga -f docker-compose.yml -f docker-compose.carga.yml --profile carga
    steps:
      - uses: actions/checkout@v5

      - name: Máquina do teste
        run: |
          {
            echo "### Ambiente"
            echo "- Runner do GitHub: $(nproc) CPUs, $(free -g | awk '/Mem/ {print $2}') GB de memória"
            echo "- Pool de conexões da API: $DB_POOL_MAX"
            echo "- Meta de p95: $META_P95_MS ms"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Teste de carga (10, 25, 50 e 100 sensores)
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p testes-carga/resultados && chmod 777 testes-carga/resultados
          $COMPOSE run --rm --no-TTY k6 2>&1 | tee k6.txt

      - name: Resultado por etapa
        if: always()
        run: |
          if [ -f testes-carga/resultados/resumo.json ]; then
            {
              echo "### Resultado"
              echo "| Etapa | Média | p95 | Maior |"
              echo "|---|---|---|---|"
              for s in 10 25 50 100; do
                jq -r --arg s "$s" '.metrics["http_req_duration{scenario:sensores_\($s)}"].values // empty
                  | "| \($s) sensores | \(.avg | . * 100 | round / 100) ms | \(.["p(95)"] | . * 100 | round / 100) ms | \(.max | . * 100 | round / 100) ms |"' \
                  testes-carga/resultados/resumo.json
              done
              jq -r '"- Lotes aceitos: \(.metrics.lotes_aceitos.values.count) (\(.metrics.lotes_aceitos.values.rate | round) por segundo)",
                     "- Falhas: \(.metrics.http_req_failed.values.passes)"' testes-carga/resultados/resumo.json
              grep -o 'POOL {[^}]*}' k6.txt | sed -e 's/^POOL //' -e 's/\\"/"/g' | jq -r '"- Pool (HikariCP): \(.conexoes_maximas) conexões; \(.pedidos_de_conexao) pedidos; espera média de \(.espera_media_ms | . * 100 | round / 100) ms; maior espera de \(.maior_espera_ms | round) ms; \(.pedidos_que_esgotaram_o_tempo) pedidos esgotaram o tempo"' || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Logs da API em caso de falha
        if: failure()
        run: $COMPOSE logs --no-color backend | tail -200

      - name: Guarda o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-pool-${{ env.DB_POOL_MAX }}
          path: |
            k6.txt
            testes-carga/resultados/resumo.json
          if-no-files-found: ignore

      - name: Apaga o ambiente
        if: always()
        run: $COMPOSE down -v

  turno:
    # Issue #165: um turno de ~10 min com 120 sensores (1 leitura a cada 2 s), rampa, platô e 2 picos de lavagem
    # química. Mede p95, requisições por segundo e o pool do banco durante o turno, e gera um relatório HTML.
    name: turno industrial (120 sensores)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_POOL_MAX: ${{ inputs.pool || '20' }}
      # Critério da issue: p95 abaixo de 250 ms na carga máxima. Aqui a carga tem ritmo fixo (até 180 leituras/s),
      # bem abaixo do teste de lotes sem pausa, então a meta vale também no runner de 2 CPUs.
      META_P95_MS: '250'
      COMPOSE: docker compose -p aguas-carga -f docker-compose.yml -f docker-compose.carga.yml --profile carga
    steps:
      - uses: actions/checkout@v5

      - name: Turno industrial
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p testes-carga/resultados && chmod 777 testes-carga/resultados
          $COMPOSE run --rm --no-TTY \
            -e K6_WEB_DASHBOARD=true -e K6_WEB_DASHBOARD_EXPORT=/resultados/turno-painel.html \
            k6 run /scripts/turno-industrial.js 2>&1 | tee k6-turno.txt

      - name: Resultado do turno
        if: always()
        run: |
          R=testes-carga/resultados/turno-industrial.json
          if [ -f "$R" ]; then
            {
              echo "### Turno industrial (pool $DB_POOL_MAX, meta de p95 $META_P95_MS ms)"
              echo "| Fase | Leituras | Média | p95 | Maior | Conexões ativas (máx.) |"
              echo "|---|---|---|---|---|---|"
              for f in rampa plato pico; do
                jq -r --arg f "$f" '.metrics as $m | ($m["http_req_duration{tipo:leitura,fase:\($f)}"].values // empty) as $t
                  | "| \($f) | \($m["leituras_aceitas{fase:\($f)}"].values.count // 0) | \($t.avg | . * 100 | round / 100) ms | \($t["p(95)"] | . * 100 | round / 100) ms | \($t.max | . * 100 | round / 100) ms | \($m["pool_conexoes_ativas{fase:\($f)}"].values.max // "-") |"' "$R"
              done
              jq -r '.metrics as $m | "- Leituras aceitas: \($m.leituras_aceitas.values.count) (\($m.leituras_aceitas.values.rate | . * 10 | round / 10) por segundo)",
                "- Respostas 5xx: \($m.respostas_5xx.values.rate * 100)%",
                "- Leituras descartadas por falta de sensor livre: \($m.dropped_iterations.values.count // 0)",
                "- Pool (HikariCP): \($m.pool_conexoes_maximas.values.value) conexões; espera média de \($m.pool_espera_media_ms.values.value | . * 100 | round / 100) ms; maior espera de \($m.pool_maior_espera_ms.values.value | round) ms; \($m.pool_pedidos_esgotados.values.value) pedidos esgotaram o tempo",
                "- Relatório HTML no artefato carga-turno-industrial"' "$R"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Logs da API em caso de falha
        if: failure()
        run: $COMPOSE logs --no-color backend | tail -200

      - name: Guarda o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-turno-industrial
          path: |
            k6-turno.txt
            testes-carga/resultados/turno-industrial.*
            testes-carga/resultados/turno-painel.html
          if-no-files-found: ignore

      - name: Apaga o ambiente
        if: always()
        run: $COMPOSE down -v
