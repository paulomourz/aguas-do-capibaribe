name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integração roda no PostgreSQL 18 do Testcontainers
      - name: Testes
        run: mvn -B clean test

      # Sem Docker o Testcontainers pula a integração e o build passa mesmo assim
      - name: Integração rodou?
        run: |
          relatorio=target/surefire-reports/TEST-br.com.aguas.integracao.IntegracaoPostgresContainerTest.xml
          if [ ! -f "$relatorio" ] || ! head -n 2 "$relatorio" | grep -q 'skipped="0"'; then
            echo "::error::Testes de integração não rodaram (Docker indisponível?)"
            exit 1
          fi

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Mesmas versões do .mise.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      # Modo offline: Wi-Fi caindo e voltando no site de produção (service worker + IndexedDB)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Prints de cada passo do fluxo do operador (e2e/fluxo-operador.spec.ts), para conferir a tela sem rodar o teste.
      - name: Guarda os prints do teste de ponta a ponta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-e2e
          path: test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      # Relatório do axe-core de cada tela e tema (e2e/acessibilidade.spec.ts, issue #172), com todas as violações,
      # inclusive as moderadas e leves, que não bloqueiam o merge.
      - name: Guarda o relatório de acessibilidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade
          path: test-results/**/axe-*.json
          retention-days: 14
          if-no-files-found: ignore

  # Vulnerabilidades conhecidas (CVEs) nas dependências do back-end (pom.xml) e do site (pnpm-lock.yaml),
  # pela base pública OSV.dev, sem token. Bloqueia com gravidade alta ou crítica (CVSS 7.0 ou mais).
  dependencias:
    name: dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSAO: v2.7.0
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      CVSS_LIMITE: '7.0'
    steps:
      - uses: actions/checkout@v5

      - name: Instala o OSV-Scanner (versão fixa, com checksum)
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSAO}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Procura vulnerabilidades
        run: |
          set +e
          ./osv-scanner scan source --config osv-scanner.toml --format json -L backend/pom.xml -L pnpm-lock.yaml > osv.json
          codigo=$?
          set -e
          # 0 = nada encontrado; 1 = vulnerabilidades encontradas; outro código = o scanner falhou.
          if [ "$codigo" -gt 1 ]; then
            echo "::error::O OSV-Scanner falhou (código $codigo)."
            exit "$codigo"
          fi

      - name: Resultado e bloqueio por gravidade
        run: |
          jq -r --argjson limite "$CVSS_LIMITE" '
            [.results[]? as $r | $r.packages[]? as $p | $p.groups[]? |
              {arquivo: $r.source.path, pacote: $p.package.name, versao: $p.package.version,
               ids: (.aliases // .ids | join(", ")), cvss: ((.max_severity // "") | tonumber? // 0)}]
            | sort_by(-.cvss)
            | if length == 0 then "Nenhuma vulnerabilidade conhecida nas dependências."
              else (["| Gravidade (CVSS) | Pacote | Versão | Identificadores | Arquivo |", "|---|---|---|---|---|"]
                + map("| \(if .cvss >= $limite then "**\(.cvss)** ⛔" elif .cvss > 0 then "\(.cvss)" else "sem nota" end) | \(.pacote) | \(.versao) | \(.ids) | \(.arquivo | split("/") | .[-1]) |"))
                | join("\n") end
          ' osv.json | tee -a "$GITHUB_STEP_SUMMARY"
          graves=$(jq --argjson limite "$CVSS_LIMITE" '[.results[]?.packages[]?.groups[]? | select(((.max_severity // "") | tonumber? // 0) >= $limite)] | length' osv.json)
          if [ "$graves" -gt 0 ]; then
            echo "::error::$graves vulnerabilidade(s) com gravidade alta ou crítica (CVSS >= $CVSS_LIMITE). Atualize a dependência ou registre a exceção em osv-scanner.toml, com motivo."
            exit 1
          fi

  docker-compose:
    name: docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Sobe os três serviços
        run: docker compose up -d --build

      - name: Testa site, login, processos e registro de lote pelo Nginx
        run: |
          testar() {
            # O Nginx pode levar alguns segundos para aceitar a primeira conexão.
            curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/ | grep -q 'id="root"'
            # Cabeçalhos de segurança do site, também no service worker (location com add_header próprio).
            for caminho in / /sw.js; do
              cabecalhos=$(curl -fsS -D - -o /dev/null "http://localhost:3000$caminho")
              grep -qi "^content-security-policy: .*frame-ancestors 'none'" <<< "$cabecalhos"
              grep -qi '^x-frame-options: DENY' <<< "$cabecalhos"
            done
            curl -fsS -o /dev/null http://localhost:3000/api/swagger-ui/index.html
            # A API é distroless (sem cat): a senha é lida do contêiner do banco, que monta os segredos.
            senha=$(docker compose exec -T db cat /segredos/admin)
            corpo=$(jq -n --arg s "$senha" '{usuario: "capibaribe.admin", senha: $s}')
            token=$(curl -fsS -H 'Content-Type: application/json' -d "$corpo" http://localhost:3000/api/auth/login | jq -r .token)
            curl -fsS -H "Authorization: Bearer $token" http://localhost:3000/api/processos > processos.json
            test "$(jq length processos.json)" -ge 4
            lote=$(jq -c '{processoId: .[0].id, pecas: 1, litros: 100}' processos.json)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$lote" http://localhost:3000/api/lotes
          }
          testar
          # Dados e senhas precisam sobreviver a uma nova subida.
          docker compose down
          docker compose up -d
          testar

      - name: Nenhuma senha nas variáveis de ambiente da API
        run: |
          id=$(docker compose ps -q backend)
          docker inspect "$id" --format '{{json .Config.Env}}' > env-container.txt
          # Sem shell na imagem: o ambiente do processo da API é lido pelo host do runner.
          sudo cat "/proc/$(docker inspect "$id" --format '{{.State.Pid}}')/environ" | tr '\0' '\n' > env-processo.txt
          test -s env-processo.txt
          for s in api postgres jwt admin gestor sensor; do
            valor=$(docker compose exec -T db cat "/segredos/$s")
            if grep -qF "$valor" env-container.txt env-processo.txt; then
              echo "::error::O segredo $s aparece nas variáveis de ambiente da API."
              exit 1
            fi
          done
          echo "Nenhum segredo nas variáveis de ambiente da API."

      - name: Contêineres sem root e com privilégios mínimos
        run: |
          for servico in db backend frontend; do
            id=$(docker compose ps -q "$servico")
            # Usuário real do processo principal, lido pelo host (as imagens distroless não têm shell).
            uid=$(sudo awk '/^Uid:/ {print $2}' "/proc/$(docker inspect "$id" --format '{{.State.Pid}}')/status")
            caps=$(docker inspect "$id" --format '{{join .HostConfig.CapDrop ","}}')
            opcoes=$(docker inspect "$id" --format '{{join .HostConfig.SecurityOpt ","}}')
            leitura=$(docker inspect "$id" --format '{{.HostConfig.ReadonlyRootfs}}')
            echo "| $servico | $uid | $caps | $opcoes | $leitura |" >> resumo-privilegios.txt
            if [ "$uid" = "0" ]; then echo "::error::$servico roda como root."; exit 1; fi
            if [ "$caps" != "ALL" ]; then echo "::error::$servico não remove todas as capabilities."; exit 1; fi
            case "$opcoes" in *no-new-privileges*) ;; *) echo "::error::$servico sem no-new-privileges."; exit 1;; esac
            if [ "$leitura" != "true" ]; then echo "::error::$servico com sistema de arquivos gravável."; exit 1; fi
          done
          {
            echo "### Privilégios dos contêineres"
            echo
            echo "| Serviço | UID | cap_drop | security_opt | Só leitura |"
            echo "|---|---|---|---|---|"
            cat resumo-privilegios.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Imagem da API (distroless, sem shell)
        run: |
          imagem=$(docker inspect "$(docker compose ps -q backend)" --format '{{.Image}}')
          tamanho=$(docker image inspect "$imagem" --format '{{.Size}}')
          mb=$((tamanho / 1000000))
          echo "Imagem da API: $mb MB" | tee -a "$GITHUB_STEP_SUMMARY"
          if docker compose exec -T backend sh -c true 2>/dev/null; then
            echo "::error::A imagem da API tem shell; devia ser distroless."
            exit 1
          fi
          test "$(docker inspect "$(docker compose ps -q backend)" --format '{{.State.Health.Status}}')" = healthy

      # Plano C (issue #225, docs/guia/roteiro-banco-de-dados.md): o mesmo sistema com o log de SQL e o Adminer.
      - name: Plano C (log de SQL e Adminer)
        run: |
          compose() { docker compose -f docker-compose.yml -f docker-compose.banco.yml "$@"; }
          compose up -d --wait
          senha=$(compose exec -T db cat /segredos/admin)
          corpo=$(jq -n --arg s "$senha" '{usuario: "capibaribe.admin", senha: $s}')
          token=$(curl -fsS --retry 15 --retry-delay 2 --retry-all-errors -H 'Content-Type: application/json' -d "$corpo" http://localhost:3000/api/auth/login | jq -r .token)
          lote=$(curl -fsS -H "Authorization: Bearer $token" http://localhost:3000/api/processos | jq -c '{processoId: .[0].id, pecas: 1, litros: 100}')
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$lote" http://localhost:3000/api/lotes
          # O INSERT do lote aparece no log do banco, feito pelo usuário restrito da API.
          compose logs --no-log-prefix db | grep -q '\[aguas_api\] LOG:  execute .*insert into lote'
          # A senha não aparece no log: o login compara o hash na API, não no SQL.
          if compose logs --no-log-prefix db | grep -qF "$senha"; then
            echo "::error::A senha do administrador apareceu no log de SQL."
            exit 1
          fi
          # O script da aula (issue #227) roda inteiro sem erro, todo bloco proibido é recusado e o banco termina igual.
          compose exec -T db psql -U postgres -d aguas -v ON_ERROR_STOP=1 < database/demonstracao/aula-banco-de-dados.sql > aula.txt 2>&1
          if grep -q 'ACEITO (não devia)' aula.txt; then
            echo "::error::O banco aceitou uma operação que o script da aula espera ver recusada."
            exit 1
          fi
          if grep -q 'MUDOU' aula.txt; then
            echo "::error::O script da aula mudou os dados do banco."
            exit 1
          fi
          recusas=$(grep -c 'RECUSADO' aula.txt)
          test "$recusas" -ge 12 || { echo "::error::Só $recusas recusas no script da aula (esperava 12 ou mais)."; exit 1; }
          echo "Script da aula: $recusas recusas do banco e todas as tabelas iguais no fim." | tee -a "$GITHUB_STEP_SUMMARY"
          # O banco atende o pgAdmin na porta 5433 deste computador.
          pg_isready -h 127.0.0.1 -p 5433 -U postgres -d aguas
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:8081/
          id=$(compose ps -q adminer)
          uid=$(sudo awk '/^Uid:/ {print $2}' "/proc/$(docker inspect "$id" --format '{{.State.Pid}}')/status")
          test "$uid" != 0 || { echo "::error::O Adminer roda como root."; exit 1; }
          echo "Plano C: INSERT do lote no log de SQL, banco na porta 5433 e Adminer de pé (UID $uid)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color db backend frontend
