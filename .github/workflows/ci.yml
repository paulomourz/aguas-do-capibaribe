name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integração roda no PostgreSQL 18 do Testcontainers
      - name: Testes
        run: mvn -B clean test

      # Sem Docker o Testcontainers pula a integração e o build passa mesmo assim
      - name: Integração rodou?
        run: |
          relatorio=target/surefire-reports/TEST-br.com.aguas.integracao.IntegracaoPostgresContainerTest.xml
          if [ ! -f "$relatorio" ] || ! head -n 2 "$relatorio" | grep -q 'skipped="0"'; then
            echo "::error::Testes de integração não rodaram (Docker indisponível?)"
            exit 1
          fi

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Mesmas versões do .mise.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  docker-compose:
    name: docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Sobe os três serviços
        run: docker compose up -d --build

      - name: Testa site, login, processos e registro de lote pelo Nginx
        run: |
          testar() {
            # O Nginx pode levar alguns segundos para aceitar a primeira conexão.
            curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/ | grep -q 'id="root"'
            curl -fsS -o /dev/null http://localhost:3000/api/swagger-ui/index.html
            senha=$(docker compose exec -T backend cat /segredos/admin)
            corpo=$(jq -n --arg s "$senha" '{usuario: "capibaribe.admin", senha: $s}')
            token=$(curl -fsS -H 'Content-Type: application/json' -d "$corpo" http://localhost:3000/api/auth/login | jq -r .token)
            curl -fsS -H "Authorization: Bearer $token" http://localhost:3000/api/processos > processos.json
            test "$(jq length processos.json)" -ge 4
            lote=$(jq -c '{processoId: .[0].id, pecas: 1, litros: 100}' processos.json)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$lote" http://localhost:3000/api/lotes
          }
          testar
          # Dados e senhas precisam sobreviver a uma nova subida.
          docker compose down
          docker compose up -d
          testar

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color db backend frontend
