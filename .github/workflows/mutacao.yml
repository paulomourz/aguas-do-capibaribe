name: Teste de mutação

# Roda o PIT no backend: muda o código das regras de negócio, da segurança e dos avisos e confere se os testes
# percebem. Falha se a sobrevivência dos mutantes não ficar abaixo de 20%. Sob demanda (Actions > Teste de
# mutação > Run workflow) e em todo PR que mude o backend. Ver docs/tecnico/testes.md.
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - backend/src/**
      - backend/pom.xml
      - .github/workflows/mutacao.yml
      - .github/scripts/resumo-mutacao.py

permissions:
  contents: read

concurrency:
  group: mutacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutacao:
    name: mutacao
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compila o código e os testes
        run: mvn -B clean test-compile

      # Os testes de integração rodam no PostgreSQL 18 do Testcontainers, como no CI.
      - name: Teste de mutação (PIT)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Resumo
        if: always()
        shell: bash -eo pipefail {0}
        run: |
          relatorio=target/pit-reports/mutations.xml
          if [ ! -f "$relatorio" ]; then
            echo "::error::O PIT não gerou o relatório (veja o passo anterior)."
            exit 1
          fi
          python3 ../.github/scripts/resumo-mutacao.py "$relatorio" 20 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guarda o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: backend/target/pit-reports
          if-no-files-found: ignore
          retention-days: 14
