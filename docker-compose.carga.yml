# Teste de carga em ambiente descartável, com projeto e banco próprios. Ver docs/tecnico/teste-carga.md.
services:
  backend:
    environment:
      # O teste usa um só usuário; o limite de lotes por minuto recusaria as requisições.
      LIMITE_LOTES_POR_MINUTO: "1000000"

  k6:
    image: grafana/k6:1.3.0
    profiles: ["carga"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080/api
    volumes:
      - ./testes-carga:/scripts:ro
      - segredos:/segredos:ro
    command: run /scripts/lotes.js
