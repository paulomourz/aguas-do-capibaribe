# Todas as informações sensíveis vêm de variáveis de ambiente (ver .env.example).
# Um arquivo backend/.env, se existir, é lido automaticamente; variáveis do sistema têm prioridade.
spring:
  application:
    name: aguas-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 10000
  jpa:
    # O esquema é do banco (banco.sql). O Hibernate apenas confere; nunca cria nem altera tabelas.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Mínimo de 32 caracteres. Gere um valor aleatório; nunca versione.
    segredo: ${JWT_SECRET:}
    expiracao: ${JWT_EXPIRACAO:8h}
  # Origens autorizadas no CORS, separadas por vírgula (ex.: http://localhost:8443). Vazio = nenhuma.
  cors-origens: ${CORS_ORIGINS:}
  # Administrador principal (gestor). Criado na inicialização se não existir; a senha só é usada nessa hora.
  admin:
    login: ${ADMIN_LOGIN:capibaribe.admin}
    nome: ${ADMIN_NOME:Administrador Capibaribe}
    senha: ${ADMIN_SENHA:}
  # Fuso usado para definir o mês dos relatórios.
  fuso-relatorios: America/Recife
  # Versão do pom.xml (preenchida no build); aparece no Swagger.
  versao: '@project.version@'

# Swagger UI em /api/swagger-ui.html e especificação em /api/v3/api-docs.
# SWAGGER_ATIVO=false desliga os dois (por exemplo, em produção).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ATIVO:true}
  swagger-ui:
    enabled: ${SWAGGER_ATIVO:true}
    persist-authorization: true
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json
