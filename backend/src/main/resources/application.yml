# Todas as informações sensíveis vêm de variáveis de ambiente (ver .env.example) ou de arquivos de segredo.
# Um arquivo backend/.env, se existir, é lido automaticamente; variáveis do sistema têm prioridade.
# No Docker, cada segredo é um arquivo em /run/secrets/aguas (nome do arquivo = nome da variável, como
# DB_PASSWORD), lido como propriedade (configtree). Assim a senha nunca vira variável de ambiente do processo.
# Fora do Docker (Render, PC), a pasta não existe e nada muda.
spring:
  application:
    name: aguas-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:configtree:${SEGREDOS_DIR:/run/secrets/aguas}/
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 20 por padrão: no teste de carga com 100 sensores, 20 conexões baixaram o p95 em 31% (docs/tecnico/teste-carga.md).
      # No Render (0,1 de CPU), a variável DB_POOL_MAX define um valor menor.
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: 10000
  # O esquema é criado e evoluído pelo Flyway (src/main/resources/db/migration), antes do Hibernate.
  flyway:
    # FLYWAY_ATIVO=false: a API não aplica migrações (quem administra o banco roda mvn flyway:migrate).
    enabled: ${FLYWAY_ATIVO:true}
    locations: classpath:db/migration
    # Usuário com permissão de criar tabelas (dono do esquema). O aguas_api não tem; sem FLYWAY_USER,
    # o Flyway usa o mesmo usuário da API.
    user: ${FLYWAY_USER:${DB_USER}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
    # Só para o banco que já existia antes do Flyway (criado pelo antigo banco.sql): FLYWAY_BASELINE=true
    # na primeira subida marca o esquema como já estando na V4 e não recria nada.
    baseline-on-migrate: ${FLYWAY_BASELINE:false}
    baseline-version: 4
    baseline-description: esquema do banco.sql com auditoria
    # Nunca apagar o banco por comando do Flyway.
    clean-disabled: true
  jpa:
    # O Hibernate apenas confere o esquema criado pelo Flyway; nunca cria nem altera tabelas.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  # Respostas em streaming (CSV de GET /relatorios/csv, issue #99): o arquivo de 1 ano pode passar dos 30 s
  # padrão do Tomcat no servidor lento do Render.
  mvc:
    async:
      request-timeout: 2m

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Mínimo de 32 caracteres. Gere um valor aleatório; nunca versione.
    segredo: ${JWT_SECRET:}
    expiracao: ${JWT_EXPIRACAO:8h}
  # Origens autorizadas no CORS, separadas por vírgula (ex.: http://localhost:8443). Vazio = nenhuma.
  cors-origens: ${CORS_ORIGINS:}
  # Administrador principal. Criado na inicialização se não existir; a senha só é usada nessa hora.
  admin:
    login: ${ADMIN_LOGIN:capibaribe.admin}
    nome: ${ADMIN_NOME:Administrador Capibaribe}
    senha: ${ADMIN_SENHA:}
  # Requisições aceitas por minuto: login por IP e registro de lotes por usuário. Acima disso, responde 429.
  # cabecalho-ip: cabeçalho com o IP real, que o proxy sempre sobrescreve (X-Real-IP no Docker,
  # CF-Connecting-IP no Render). Vazio = IP da conexão.
  limite:
    login-por-minuto: ${LIMITE_LOGIN_POR_MINUTO:5}
    lotes-por-minuto: ${LIMITE_LOTES_POR_MINUTO:60}
    cabecalho-ip: ${LIMITE_CABECALHO_IP:}
  # Conta do gestor (capibaribe.gestor). Criada na inicialização se GESTOR_SENHA estiver definida.
  gestor:
    senha: ${GESTOR_SENHA:}
  # Conta do sensor (sensor.wokwi). Criada na inicialização se SENSOR_SENHA estiver definida.
  sensor:
    senha: ${SENSOR_SENHA:}
  # Aviso no Telegram quando um alerta é aberto (issue #52). Desligado sem TELEGRAM_TOKEN e TELEGRAM_CHAT_ID.
  # SITE_URL (opcional) põe o link do alerta na mensagem. Nunca versione o token.
  telegram:
    token: ${TELEGRAM_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    site-url: ${SITE_URL:}
    # Se o envio falhar, a API tenta de novo (3 envios no total). A primeira pausa é esta, e cada uma
    # seguinte é o dobro (1 s e depois 2 s). Se todos falharem, o aviso fica gravado como pendente
    # (tabela aviso_pendente).
    espera-entre-tentativas: 1s
    # Os pendentes são reenviados por uma rotina, a cada reenvio-a-cada, até reenvio-limite depois de
    # ficarem pendentes. Quando um chega, aviso_pendente.enviado_em recebe a hora do envio.
    reenvio-a-cada: 5m
    reenvio-limite: 24h
  # Fuso usado para definir o mês dos relatórios.
  fuso-relatorios: America/Recife
  # Versão do pom.xml (preenchida no build); aparece no Swagger.
  versao: '@project.version@'

# Monitoramento (issue #51), na mesma porta e com o mesmo prefixo /api:
# - /api/actuator/health: aberto, para o Render e serviços de monitoramento. Sem token, só {"status":"UP"};
#   os detalhes (banco, disco) só aparecem para o admin.
# - /api/actuator/metrics: só admin. Inclui http.server.requests (tempo de resposta por rota),
#   memória (jvm.memory.used) e conexões com o banco (hikaricp.connections).
# Nenhum outro endpoint do Actuator é exposto (env, beans, heapdump etc. mostrariam segredos).
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      access: read-only
      show-details: when-authorized
      roles: ADMIN
    metrics:
      access: read-only

# Swagger UI em /api/swagger-ui.html e especificação em /api/v3/api-docs.
# SWAGGER_ATIVO=false desliga os dois (por exemplo, em produção).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ATIVO:true}
  swagger-ui:
    enabled: ${SWAGGER_ATIVO:true}
    persist-authorization: true
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json
