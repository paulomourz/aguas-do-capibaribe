# Cabeçalhos de segurança do site. Incluído no server e em cada location com add_header próprio,
# porque o Nginx não herda add_header do server num location que tenha os seus.
# CSP: só scripts do próprio site; estilos e fontes também do Google Fonts; a API fica no mesmo endereço
# (/api, pelo proxy). frame-ancestors e X-Frame-Options impedem abrir o site dentro de outro (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
