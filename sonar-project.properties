# Análise estática e Quality Gate no SonarQube da disciplina (issue #168), em https://sonar.fchicout.dev.
# Usado pelo workflow .github/workflows/qualidade.yml. O projeto usa o gate SENAC-PI-Quality-Gate.
sonar.host.url=https://sonar.fchicout.dev
sonar.projectKey=aguas-do-capibaribe
sonar.projectName=Águas do Capibaribe
sonar.sourceEncoding=UTF-8

# Código: site (React) e API (Spring Boot). Os testes ficam como testes, fora da contagem de código.
sonar.sources=src,backend/src/main/java
sonar.exclusions=src/**/__testes__/**,src/**/*.test.ts
sonar.tests=src,backend/src/test/java,e2e
sonar.test.inclusions=src/**/__testes__/**,src/**/*.test.ts,backend/src/test/java/**,e2e/**

# Java compilado pelo mvn test, antes da análise.
sonar.java.source=25
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Cobertura: JaCoCo (API) e Vitest (site).
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# O passo do CI espera o resultado do Quality Gate e falha se ele reprovar, o que bloqueia o merge do PR.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
