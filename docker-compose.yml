# Sobe banco, API e site com um comando: docker compose up -d --build
# Site em http://localhost:3000. Senha inicial do administrador: docker compose logs segredos
name: aguas-do-capibaribe

# Privilégios mínimos em todos os serviços (issue #171): nenhuma capability do Linux, sem ganhar privilégio
# depois de iniciar (setuid) e sistema de arquivos só de leitura. Cada serviço escreve só nos volumes e nos
# tmpfs que declara. O job docker-compose do CI confere isso e que nenhum processo em execução é root.
x-privilegios-minimos: &privilegios-minimos
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  # Na primeira subida, sorteia as senhas e o segredo do JWT e guarda num volume. Nenhuma senha fica no Git.
  # É o único que roda como root: os volumes novos pertencem ao root. Mesmo assim, sem nenhuma capability, e o
  # contêiner termina logo depois de gravar os arquivos.
  segredos:
    image: postgres:18-alpine
    <<: *privilegios-minimos
    tmpfs:
      - /tmp
    volumes:
      - segredos:/segredos
      - segredos-api:/segredos-api
      - db-init:/db-init
    entrypoint:
      - sh
      - -c
      - |
        set -e
        novo() { tr -dc 'A-Za-z0-9' < /dev/urandom | head -c "$$1"; }
        cd /segredos
        [ -f postgres ] || novo 32 > postgres
        [ -f api ] || novo 32 > api
        [ -f jwt ] || novo 64 > jwt
        [ -f admin ] || novo 16 > admin
        [ -f gestor ] || novo 16 > gestor
        [ -f sensor ] || novo 16 > sensor
        chmod 644 postgres api jwt admin gestor sensor
        # Segredos da API, um arquivo por variável, num volume que só a API monta (em /run/secrets/aguas).
        cp -f postgres /segredos-api/FLYWAY_PASSWORD
        cp -f api /segredos-api/DB_PASSWORD
        cp -f jwt /segredos-api/JWT_SECRET
        cp -f admin /segredos-api/ADMIN_SENHA
        cp -f gestor /segredos-api/GESTOR_SENHA
        cp -f sensor /segredos-api/SENSOR_SENHA
        chmod 444 /segredos-api/FLYWAY_PASSWORD /segredos-api/DB_PASSWORD /segredos-api/JWT_SECRET /segredos-api/ADMIN_SENHA /segredos-api/GESTOR_SENHA /segredos-api/SENSOR_SENHA
        # Usuário restrito da API, antes do Flyway: as migrações dão a ele as permissões de cada tabela.
        cat > /db-init/01-usuario-api.sql <<FIM
        CREATE ROLE aguas_api LOGIN PASSWORD '$$(cat api)'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
        GRANT CONNECT ON DATABASE aguas TO aguas_api;
        GRANT USAGE ON SCHEMA public TO aguas_api;
        FIM
        chmod 644 /db-init/01-usuario-api.sql
        echo "Administrador: capibaribe.admin"
        echo "Senha inicial: $$(cat admin)"
        echo "Gestor: capibaribe.gestor"
        echo "Senha do gestor: $$(cat gestor)"
        echo "Sensor: sensor.wokwi"
        echo "Senha do sensor: $$(cat sensor)"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Direto como o usuário postgres (uid 70), sem passar pelo root: o volume de dados já pertence a ele.
    user: postgres
    <<: *privilegios-minimos
    tmpfs:
      - /var/run/postgresql
      - /tmp
    depends_on:
      segredos:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: aguas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /segredos/postgres
    volumes:
      - db-dados:/var/lib/postgresql
      - segredos:/segredos:ro
      - db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante a criação inicial, o PostgreSQL só aceita conexões locais pelo socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "aguas"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # A imagem distroless já roda como nonroot (uid 65532).
    <<: *privilegios-minimos
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: aguas
      DB_USER: aguas_api
      DB_SSLMODE: disable
      FLYWAY_USER: postgres
      CORS_ORIGINS: http://localhost:3000
      LIMITE_CABECALHO_IP: X-Real-IP
    # Segredos como arquivos só de leitura, no padrão do Docker Secrets: nenhuma senha aparece nas variáveis de
    # ambiente do contêiner (docker inspect) nem do processo (/proc/1/environ).
    volumes:
      - segredos-api:/run/secrets/aguas:ro
    healthcheck:
      # A imagem distroless não tem shell: o healthcheck é uma classe Java que chama /api/actuator/health.
      test: ["CMD", "java", "-Xmx16m", "-XX:TieredStopAtLevel=1", "-cp", "/app/saude", "Saude"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    # Nginx sem root (uid 101), escutando na porta 8080 dentro do contêiner.
    <<: *privilegios-minimos
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

  # Opcional: liga o site local à internet, para o projeto local do Wokwi. Só sobe com --profile tunel.
  # Enquanto estiver ligado, o site e a API locais ficam acessíveis pelo endereço que aparece nos logs.
  tunel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunel"]
    <<: *privilegios-minimos
    depends_on:
      - frontend
    command: tunnel --no-autoupdate --url http://frontend:8080

volumes:
  segredos:
  segredos-api:
  db-init:
  db-dados:
